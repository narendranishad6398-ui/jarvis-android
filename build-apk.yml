name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Auto-Move Files into App Directory
      run: |
        mkdir -p app/src/main/java/com/stark/jarvis
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/xml
        [ -f "AndroidManifest.xml" ] && mv -f AndroidManifest.xml app/src/main/
        [ -f "activity_assistant_overlay.xml" ] && mv -f activity_assistant_overlay.xml app/src/main/res/layout/
        [ -f "activity_main.xml" ] && mv -f activity_main.xml app/src/main/res/layout/
        [ -f "styles.xml" ] && mv -f styles.xml app/src/main/res/values/
        [ -f "strings.xml" ] && mv -f strings.xml app/src/main/res/values/
        [ -f "accessibility_service_config.xml" ] && mv -f accessibility_service_config.xml app/src/main/res/xml/
        [ -f "CommandExecutor.kt" ] && mv -f CommandExecutor.kt app/src/main/java/com/stark/jarvis/
        [ -f "AssistantOverlayActivity.kt" ] && mv -f AssistantOverlayActivity.kt app/src/main/java/com/stark/jarvis/
        [ -f "JarvisService.kt" ] && mv -f JarvisService.kt app/src/main/java/com/stark/jarvis/
        [ -f "MainActivity.kt" ] && mv -f MainActivity.kt app/src/main/java/com/stark/jarvis/
        [ -f "BatteryReceiver.kt" ] && mv -f BatteryReceiver.kt app/src/main/java/com/stark/jarvis/
        [ -f "JarvisAccessibilityService.kt" ] && mv -f JarvisAccessibilityService.kt app/src/main/java/com/stark/jarvis/
        [ -f "glass_card_bg.xml" ] && mv -f glass_card_bg.xml app/src/main/res/drawable/
        [ -f "glass_pill_cyan.xml" ] && mv -f glass_pill_cyan.xml app/src/main/res/drawable/
        [ -f "glass_pill_dark.xml" ] && mv -f glass_pill_dark.xml app/src/main/res/drawable/
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

    - name: Build APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-screen-off-apk
        path: app/build/outputs/apk/debug/app-debug.apk
